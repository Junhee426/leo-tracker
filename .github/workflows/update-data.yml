name: Update LEO tracker data

on:
  workflow_dispatch:
  schedule:
    # 06:00 Korea Standard Time (21:00 UTC, previous day)
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python updater/update_data.py
      - name: Commit changed data
        run: |
          git config user.name "leo-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current.json data/changes.json data/snapshots/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily constellation update"
            git push
          fi
